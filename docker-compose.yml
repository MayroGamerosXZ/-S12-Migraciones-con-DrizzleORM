services:
  postgres:
    image: postgres:16-alpine
    container_name: migraciones-con-drizzleorm
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Robin1710
      POSTGRES_DB: drizzle_products_db
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
